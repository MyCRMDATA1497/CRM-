<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>보험 고객관리 CRM</title>
<meta name="theme-color" content="#16345C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="고객CRM">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap');
:root{
  --navy:#16345C; --navy2:#1F4E8C; --blue:#2E6FD0; --sky:#EAF2FC;
  --ink:#202B38; --muted:#77839A; --line:#DFE5EE; --bg:#F2F5F9; --panel:#FFFFFF;
  --green:#1E9E6A; --green-soft:#E5F5EE;
  --gold:#C8891B; --gold-soft:#FCF3DF;
  --red:#D5452F; --red-soft:#FBE9E5;
  --purple:#6C4BC4; --purple-soft:#EFEAF9;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
body.compact{font-size:13px;}
.mono{font-family:'Roboto Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}

/* ---------- Header ---------- */
.header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;padding:12px 20px 10px;
}
.header-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.logo{font-weight:800;font-size:21px;letter-spacing:.02em;flex:none;}
.agent-input{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:6px 10px;color:#fff;width:100px;font-size:13px;flex:none;
}
.agent-input::placeholder{color:rgba(255,255,255,.6);}
.hbtns{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.hbtn{
  position:relative;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;
}
.hbtn:hover{background:rgba(255,255,255,.28);}
.hbtn.teal{background:#18B8C9;border-color:#18B8C9;}
.hbtn.purple{background:#7A5CD6;border-color:#7A5CD6;}
.hbtn.crimson{background:#D6456B;border-color:#D6456B;}
.hbtn.gold{background:#E0A93C;border-color:#E0A93C;color:#2c1f05;}
.hbtn.slate{background:#3D5E85;border-color:#3D5E85;}
.hbtn .bdg{
  position:absolute;top:-7px;right:-6px;background:#fff;color:var(--red);
  border-radius:100px;min-width:18px;height:18px;padding:0 4px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.hsel{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;
}
.hsel option{color:var(--ink);}
.save-ind{font-size:12px;color:#9FE8B8;font-weight:700;white-space:nowrap;}
.save-ind.saving{color:#FFE08A;}
.stats-line{margin-top:7px;font-size:12.5px;color:#BFD4F2;display:flex;gap:12px;flex-wrap:wrap;}
.stats-line b{color:#fff;}

/* ---------- Alert bar ---------- */
.alert-bar{
  background:var(--red);color:#fff;padding:9px 20px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:10px;cursor:pointer;
}
.alert-bar .cnt{
  background:#fff;color:var(--red);border-radius:50%;width:24px;height:24px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none;
}
.alert-bar.ok{background:var(--green);}
.alert-detail{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:none;}
.alert-detail.open{display:block;}
.alert-detail .item{padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.alert-detail .item:last-child{border-bottom:none;}
.alert-detail .d{color:var(--red);font-weight:700;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:8px;padding:12px 20px 0;}
.tab{
  background:var(--panel);border:1px solid var(--line);border-bottom:none;
  border-radius:10px 10px 0 0;padding:10px 26px;font-weight:700;font-size:14.5px;color:var(--muted);
}
.tab.active{color:#fff;background:var(--blue);border-color:var(--blue);}

/* ---------- Layout ---------- */
.content{padding:0 20px 60px;}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:14px;}

/* ---------- List ---------- */
.list-controls{display:flex;gap:8px;margin-bottom:10px;}
.list-controls input[type=text]{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);}
.btn-primary{background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;white-space:nowrap;}
.btn-primary:hover{background:#245CB4;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{border:1px solid var(--line);background:#fff;border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);}
.chip.on-all{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip.on-done{background:var(--green);color:#fff;border-color:var(--green);}
.chip.on-prospect{background:var(--gold);color:#fff;border-color:var(--gold);}
.chip.on-absent{background:var(--muted);color:#fff;border-color:var(--muted);}
.chip.on-reject{background:var(--red);color:#fff;border-color:var(--red);}
.sort-row{display:flex;gap:6px;margin-bottom:10px;}
.sort-row select{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;}
.cust-list{max-height:62vh;overflow-y:auto;}
.cust-item{padding:11px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;}
.cust-item:hover{background:var(--bg);}
.cust-item.active{background:var(--sky);border-color:var(--blue);}
.ci-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.ci-name{font-weight:700;font-size:14.5px;}
.ci-age{font-size:12px;color:var(--muted);}
.badge{font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;}
.badge.f{background:#FBE3EC;color:#C2497E;}
.badge.m{background:var(--sky);color:var(--blue);}
.badge.st-가입완료{background:var(--green-soft);color:var(--green);}
.badge.st-가망고객{background:var(--gold-soft);color:var(--gold);}
.badge.st-부재중{background:#EEF0F4;color:var(--muted);}
.badge.st-거절{background:var(--red-soft);color:var(--red);}
.ci-phone{font-size:12.5px;color:var(--muted);margin-top:3px;font-family:'Roboto Mono',monospace;}
.ci-memo{font-size:12px;color:var(--blue);background:var(--sky);border-radius:6px;padding:3px 8px;margin-top:5px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-count{font-size:11.5px;color:var(--muted);margin:0 0 8px;font-family:'Roboto Mono',monospace;}
.empty-list{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;}

/* ---------- Detail ---------- */
.detail-head{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  border-radius:12px;color:#fff;padding:16px 18px;margin-bottom:14px;
}
.dh-row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.dh-name{font-size:22px;font-weight:800;}
.dh-agebits{font-size:13px;color:#BFD4F2;}
.dh-agebits b{color:#fff;}
.dh-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.dh-actions select{
  background:var(--gold-soft);border:1.5px solid var(--gold);color:#7a5310;
  font-weight:700;border-radius:8px;padding:6px 8px;font-size:12.5px;
}
.dbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;}
.dbtn:hover{background:rgba(255,255,255,.28);}
.dbtn.danger{background:rgba(213,69,47,.85);border-color:transparent;}
.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.section h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.info-item{padding:10px 0;border-bottom:1px solid var(--line);}
.info-item .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px;}
.info-item .v{font-size:14px;word-break:break-all;}
.info-item .v a{color:var(--blue);text-decoration:none;font-weight:700;}
.mini-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-block;cursor:pointer;}
.mini:hover{border-color:var(--blue);color:var(--blue);}
.mini.tmap{background:var(--gold-soft);border-color:#E8CE9C;}
.mini.kakao{background:#FEF3C7;border-color:#F0D98A;}
.mini.naver{background:var(--green-soft);border-color:#B5DEC9;}
.mini.call{background:var(--green);border-color:var(--green);color:#fff;}
.mini.sms{background:var(--blue);border-color:var(--blue);color:#fff;}
.memo-view{white-space:pre-wrap;line-height:1.7;font-size:13.5px;background:var(--bg);border-radius:8px;padding:12px;}

/* ---------- 실손 ---------- */
.silson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.silson-card{border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:10px;padding:12px;background:#fff;}
.silson-card.o{border-top-color:#E8762C;}
.silson-card.r{border-top-color:var(--red);}
.silson-card.g{border-top-color:var(--green);}
.silson-card .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.silson-card .v{font-size:16px;font-weight:800;}
.silson-card .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
.gen-pill{display:inline-block;border-radius:100px;padding:3px 12px;font-weight:800;font-size:14px;}
.silson-note{margin-top:12px;background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.6;}
.silson-empty{color:var(--muted);font-size:13px;padding:8px 0;}
.silson-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.silson-form input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);}
.btn-dark{background:var(--ink);color:#fff;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;}

/* ---------- 상담 이력 ---------- */
.hist-form{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.hist-form input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:'Roboto Mono',monospace;font-size:13px;}
.hist-form textarea{flex:1;min-width:180px;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical;}
.hist-entry{display:grid;grid-template-columns:86px 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.hist-entry:last-child{border-bottom:none;}
.hist-date{color:var(--blue);font-weight:700;font-family:'Roboto Mono',monospace;font-size:12.5px;}
.hist-content{white-space:pre-wrap;line-height:1.6;}
.x-del{color:#C6CEDA;font-size:16px;align-self:start;}
.x-del:hover{color:var(--red);}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.cal-title{font-size:19px;font-weight:800;}
.cal-nav{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:700;}
.cal-legend{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);}
.cal-dow{background:var(--bg);padding:7px 0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.cal-dow.sun{color:var(--red);} .cal-dow.sat{color:var(--blue);}
.cal-cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;background:#fff;}
body.compact .cal-cell{min-height:78px;}
.cal-cell:hover{background:var(--sky);}
.cal-cell.other{background:var(--bg);color:#B7C0CE;}
.cal-daynum{font-size:12.5px;font-weight:700;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;}
.cal-cell.today .cal-daynum{background:var(--red);color:#fff;}
.cal-cell .sun-n{color:var(--red);} .cal-cell .sat-n{color:var(--blue);}
.bday-mark{font-size:11px;background:#FBE3EC;color:#C2497E;border-radius:5px;padding:1px 5px;font-weight:700;margin-left:3px;}
.evt{display:flex;align-items:center;gap:4px;font-size:11.5px;border-radius:5px;padding:2px 5px;margin-top:3px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;}
.evt input{margin:0;flex:none;}
.evt.c-재연락{background:var(--green-soft);color:#106b46;}
.evt.c-미팅{background:var(--sky);color:#1c56a8;}
.evt.c-카톡관리{background:var(--gold-soft);color:#8a5c0c;}
.evt.c-중요{background:#FFF3D6;color:#8a5c0c;}
.evt.done{text-decoration:line-through;opacity:.55;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(22,36,53,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;padding:22px;max-height:92vh;overflow-y:auto;}
.modal.wide{max-width:960px;}
.modal.mid{max-width:640px;}
.modal h3{margin:0 0 16px;font-size:17px;display:flex;align-items:center;gap:8px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);}
.field textarea{min-height:64px;resize:vertical;}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.btn-cancel{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;}
.btn-danger-line{border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;margin-right:auto;}
.warn-box{background:var(--red-soft);border:1px solid #F0C4BB;color:#8f2d1d;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:12px;}
.gen-note{background:var(--gold-soft);border:1px solid #EBD9AE;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}

/* ---------- 리스트형 모달 공용 ---------- */
.row-list .row{display:grid;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.row-list .row:last-child{border-bottom:none;}
.row-list input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;}
.row-list .rc2{grid-template-columns:1fr 1fr auto;}
.row-list .rc3{grid-template-columns:1fr 1fr 1fr auto;}
.rl-actions{display:flex;gap:5px;}
.mini-red{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;font-size:12px;color:var(--muted);}
.mini-red:hover{border-color:var(--red);color:var(--red);}

/* ---------- 세대 비교표 ---------- */
.gen-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px;}
.gen-table th,.gen-table td{border:1px solid var(--line);padding:9px 6px;text-align:center;}
.gen-table thead th{color:#fff;font-size:12.5px;}
.gen-table thead th:first-child{background:var(--navy);}
.gen-table tbody td:first-child{background:var(--bg);font-weight:700;text-align:left;padding-left:12px;}
.g1{background:#2E6FD0;} .g2a{background:#6C4BC4;} .g2b{background:#2B3A8F;}
.g3{background:#1E7A5A;} .g4{background:#D97622;} .g5{background:#8A1E42;}
.tx-good{color:var(--green);font-weight:700;} .tx-warn{color:#D97622;font-weight:700;} .tx-bad{color:var(--red);font-weight:700;}
.table-wrap{overflow-x:auto;}

/* ---------- SCRIPT ---------- */
.script-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.stab{border:1px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);}
.stab.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.script-body{width:100%;min-height:320px;padding:14px;border:1px solid var(--line);border-radius:0 10px 10px 10px;background:#FBFCFE;font-size:13.5px;line-height:1.8;resize:vertical;}

/* ---------- Quick message ---------- */
.tpl-item{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
.tpl-item:hover{border-color:var(--blue);background:var(--sky);}
.tpl-item .t{font-weight:700;font-size:13.5px;margin-bottom:4px;}
.tpl-item .b{font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.5;}
.tpl-preview{background:var(--bg);border-radius:9px;padding:12px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;margin-bottom:12px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.mobile-back{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700;margin-bottom:10px;}
.detail-placeholder{display:flex;align-items:center;justify-content:center;min-height:340px;color:var(--muted);text-align:center;line-height:1.8;font-size:13.5px;}

@media (max-width:900px){
  .detail-cols{grid-template-columns:1fr !important;}
  .grid{grid-template-columns:1fr;}
  .content{padding:0 10px 70px;}
  .header{padding:11px 12px 9px;}
  .alert-bar,.alert-detail{padding-left:12px;padding-right:12px;}
  .tabs{padding:10px 10px 0;}
  .grid.detail-open .list-panel{display:none;}
  .grid:not(.detail-open) .detail-panel{display:none;}
  .mobile-back{display:inline-block;}
  .info-grid{grid-template-columns:1fr;}
  .cal-cell{min-height:74px;padding:3px;}
  .evt{font-size:10.5px;padding:2px 3px;}
  .cust-list{max-height:none;}
  .dh-name{font-size:19px;}
  .hbtn{padding:6px 8px;font-size:11.5px;}
}
body.dark{--bg:#141A22;--panel:#1E2630;--ink:#E6EBF2;--muted:#8C99AC;--line:#32404F;--sky:#24344A;--gold-soft:#3A3020;--green-soft:#1E3329;--red-soft:#3A241F;--purple-soft:#2C2544;}
body.dark .cal-cell{background:var(--panel);}
body.dark .cal-cell.other,body.dark .cal-dow{background:var(--bg);}
body.dark .chip,body.dark .cal-nav,body.dark .mini,body.dark .btn-cancel,body.dark .mini-red,body.dark .stab{background:var(--panel);color:var(--muted);}
body.dark .mini{color:var(--ink);}
body.dark .modal{background:var(--panel);}
body.dark .mini.tmap{background:#3A3020;border-color:#5a4a26;}

function hasClaudeStorage(){return typeof window.storage!=='undefined'&&window.storage&&typeof window.storage.get==='function';}
async function storageGet(){
  if(hasClaudeStorage()){
    try{const r=await window.storage.get(KEY,false);if(r&&r.value)return r.value;}catch(e){}
  }
  try{return localStorage.getItem(KEY);}catch(e){return null;}
}
async function storageSet(v){
  let ok=false;
  if(hasClaudeStorage()){
    try{const r=await window.storage.set(KEY,v,false);ok=!!r;}catch(e){}
  }
  try{localStorage.setItem(KEY,v);ok=true;}catch(e){}
  return ok;
}
async function loadDB(){
  try{
    const v=await storageGet();
    if(v){
      const r={value:v};
      const d=JSON.parse(r.value);
      // 기본값과 병합 (새 필드 보존)
      db={...db,...d};
      if(!d.scripts)db.scripts=db.scripts;
      if(!d.insurerContacts)db.insurerContacts=db.insurerContacts;
      if(!d.repCodes)db.repCodes=[];
      if(!d.credentials)db.credentials=[];
      if(!d.autoAlerts)db.autoAlerts={};
      if(!d.statusLog)db.statusLog=[];
    }
  }catch(e){}
}

/* ================= 주민번호 → 생년월일/나이 ================= */
function parseRRN(rrn){
  if(!rrn)return null;
  let front,g;
  if(rrn.includes('-')){
    const parts=rrn.split('-');
    front=parts[0].replace(/[^0-9]/g,'');
    const back=(parts[1]||'').replace(/[^0-9]/g,'');
    if(front.length<6||!back.length)return null;
    g=+back[0];
  }else{
    const m=rrn.replace(/[^0-9]/g,'');
    if(m.length<7)return null;
    front=m; g=+m[6];
  }
  const yy=+front.slice(0,2), mm=+front.slice(2,4), dd=+front.slice(4,6);
  if(mm<1||mm>12||dd<1||dd>31)return null;
  let century;
  if(g===1||g===2||g===5||g===6)century=1900;
  else if(g===3||g===4||g===7||g===8)century=2000;
  else if(g===9||g===0)century=1800;
  else return null;
  const gender=(g%2===1)?'남':'여';
  return {y:century+yy,m:mm,d:dd,gender};
}
function custBirth(c){
  // 엑셀의 생년월일 컬럼이 있으면 우선 사용, 없으면 주민번호에서 계산
  if(c.birth&&/^\d{4}-\d{2}-\d{2}/.test(c.birth)){
    return {y:+c.birth.slice(0,4),m:+c.birth.slice(5,7),d:+c.birth.slice(8,10),gender:c.gender||''};
  }
  return parseRRN(c.rrn);
}
function calcAges(b){
  if(!b)return null;
  const now=new Date();
  const birth=new Date(b.y,b.m-1,b.d);
  if(isNaN(birth))return null;
  let age=now.getFullYear()-b.y;
  const hadBday=(now.getMonth()+1>b.m)||(now.getMonth()+1===b.m&&now.getDate()>=b.d);
  if(!hadBday)age--;
  let lastBday=new Date(b.y+age, b.m-1, b.d);
  const monthsSince=(now-lastBday)/(1000*60*60*24*30.4375);
  const insAge=monthsSince>=6?age+1:age;
  let sy=b.m+6, sm=sy>12?sy-12:sy;
  const sangryeong=String(sm).padStart(2,'0')+'/'+String(b.d).padStart(2,'0');
  return {age,insAge,sangryeong};
}
function birthdayPeople(){ // 이번 달 생일자
  const now=new Date();const M=now.getMonth()+1,D=now.getDate();
  const arr=[];
  db.customers.forEach(c=>{
    const b=custBirth(c);
    if(b&&b.m===M)arr.push({c,day:b.d,today:b.d===D});
  });
  arr.sort((a,b)=>a.day-b.day);
  return arr;
}

function silsonGen(joinDate){
  if(!joinDate)return null;
  const ym=joinDate.slice(0,7).replace('-','');
  const n=+ym; if(isNaN(n)||String(n).length<6)return null;
  if(n<=200909)return GENS[0];
  if(n<=201212)return GENS[1];
  if(n<=201703)return GENS[2];
  if(n<=202106)return GENS[3];
  if(n<=202603)return GENS[4];
  return GENS[5];
}
function rejoinInfo(joinDate,gen){
  if(!gen||!gen.rejoin)return null;
  const jd=new Date(joinDate); if(isNaN(jd))return null;
  const rd=new Date(jd); rd.setFullYear(rd.getFullYear()+gen.rejoin);
  const now=new Date();
  let months=(rd.getFullYear()-now.getFullYear())*12+(rd.getMonth()-now.getMonth());
  if(rd.getDate()<now.getDate())months--;
  const y=Math.floor(months/12), m=months%12;
  const dateStr=rd.getFullYear()+'. '+String(rd.getMonth()+1).padStart(2,'0')+'. '+String(rd.getDate()).padStart(2,'0')+'.';
  return {dateStr, remain:months<0?'경과':(y+'년 '+m+'개월 남음'), passed:months<0};
}

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(str){let out='';for(const ch of str){const code=ch.charCodeAt(0)-0xAC00;out+=(code>=0&&code<11172)?CHO[Math.floor(code/588)]:ch;}return out;}
function filtered(){
  let list=[...db.customers];
  if(state.gender!=='전체')list=list.filter(c=>c.gender===state.gender);
  if(state.status!=='전체')list=list.filter(c=>c.status===state.status);
  if(state.tag)list=list.filter(c=>(c.tags||[]).includes(state.tag));
  const q=state.search.trim().toLowerCase();
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||chosung(c.name||'').includes(q)||(c.phone||'').replace(/-/g,'').includes(q.replace(/-/g,''))||(c.memo||'').toLowerCase().includes(q));
  if(state.sort==='updated')list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  else if(state.sort==='created')list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return list;
}

    <button class="tab ${state.view==='home'?'active':''}" data-view="home">🏠 오늘</button>
    <button class="tab ${state.view==='customers'?'active':''}" data-view="customers">👤 고객</button>
    <button class="tab ${state.view==='calendar'?'active':''}" data-view="calendar">🗓 캘린더</button>
  </nav>

  <div class="content">
    ${state.view==='home'?renderHome():state.view==='customers'?renderCustomers():renderCalendar()}
  </div>`;

  attach();
}

/* ================= 캘린더 ================= */
const CATS=[
  {id:'재연락',color:'#1E9E6A'},{id:'미팅',color:'#2E6FD0'},
  {id:'카톡관리',color:'#C8891B'},{id:'중요',color:'#E0A93C',label:'⭐ 중요 할 일'}
];
function renderCalendar(){
  const y=state.calY,m=state.calM;
  const first=new Date(y,m,1), startDow=first.getDay();
  const daysIn=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({d:prevDays-i,other:true,date:null});
  for(let d=1;d<=daysIn;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({d,other:false,date:ds});
  }
  while(cells.length%7!==0)cells.push({d:cells.length%7,other:true,date:null});
  const t=todayStr();
  const monthEvents=db.events.filter(e=>e.date&&e.date.startsWith(y+'-'+String(m+1).padStart(2,'0')));
  const counts={};CATS.forEach(c=>counts[c.id]=monthEvents.filter(e=>e.category===c.id).length);
  // 이번 달 생일자 맵
  const bdayMap={};
  db.customers.forEach(c=>{const b=custBirth(c);if(b&&b.m===m+1){(bdayMap[b.d]=bdayMap[b.d]||[]).push(c.name);}});

  return `
  <div class="panel" style="border-radius:0 12px 12px 12px">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">◀</button>
      <span class="cal-title">${y}년 ${m+1}월</span>
      <button class="cal-nav" id="calNext">▶</button>
      <button class="cal-nav" id="calToday" style="color:var(--blue)">오늘</button>
      <button class="btn-primary" id="btnNewEvent">+ 일정 추가</button>
      <div class="cal-legend">
        <span>전체 <b>${monthEvents.length}</b></span>
        ${CATS.map(c=>`<span><span class="dot" style="background:${c.color}"></span>${c.label||c.id} ${counts[c.id]}</span>`).join('')}
        <span><span class="dot" style="background:#C2497E"></span>생일</span>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">💡 빈 날짜 클릭 → 일정 추가 · 일정 클릭 → 수정/삭제 · 체크박스 → 완료 처리</div>
    <div class="cal-grid">
      ${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="cal-dow ${i===0?'sun':''} ${i===6?'sat':''}">${d}</div>`).join('')}
      ${cells.map((cell,i)=>{
        const dow=i%7;
        if(cell.other)return `<div class="cal-cell other"><span class="cal-daynum">${cell.d}</span></div>`;
        const evts=db.events.filter(e=>e.date===cell.date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
        const bd=bdayMap[cell.d];
        return `<div class="cal-cell ${cell.date===t?'today':''}" data-date="${cell.date}">
          <span class="cal-daynum ${dow===0?'sun-n':''} ${dow===6?'sat-n':''}">${cell.d}</span>
          ${bd?`<span class="bday-mark">🎂 ${esc(bd.join(', '))}</span>`:''}
          ${evts.map(e=>`
            <div class="evt c-${e.category} ${e.done?'done':''}" data-evt="${e.id}">
              <input type="checkbox" data-toggle="${e.id}" ${e.done?'checked':''}>
              ${e.category==='중요'?'⭐':''}${e.time?`<span class="mono">${esc(e.time)}</span>`:''} ${esc(e.title)}
            </div>`).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ================= 이벤트 바인딩 ================= */
function attach(){
  const $=id=>document.getElementById(id);
  const agent=$('agentName');
  if(agent)agent.onchange=async e=>{db.agent=e.target.value.trim();await saveDB();toast('설계사 이름을 저장했습니다.');};

  const lg=$('btnLogo');if(lg)lg.onclick=()=>{state.view='home';state.mobileDetail=false;render();};
  const alertBar=$('alertBar');
  if(alertBar)alertBar.onclick=()=>{state.alertOpen=!state.alertOpen;render();};
  document.querySelectorAll('[data-goto-date]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const d=new Date(b.getAttribute('data-goto-date'));
    state.view='calendar';state.calY=d.getFullYear();state.calM=d.getMonth();render();
  });

  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.getAttribute('data-view');render();});
  document.querySelectorAll('[data-open-cust]').forEach(el=>el.onclick=e=>{e.stopPropagation();state.view='customers';state.activeId=el.getAttribute('data-open-cust');state.mobileDetail=true;render();});
  document.querySelectorAll('[data-go-cal]').forEach(b=>b.onclick=()=>{state.view='calendar';render();});
  document.querySelectorAll('[data-open-backup]').forEach(b=>b.onclick=openBackup);
  document.querySelectorAll('[data-dismiss-backup]').forEach(b=>b.onclick=()=>{state.backupDismiss=true;render();});

  /* 헤더 버튼 */
  const bs=$('btnScript');if(bs)bs.onclick=()=>openScript();
  const bsc=$('btnScriptC');if(bsc)bsc.onclick=()=>openScript(active());
  const bsch=$('btnSchedule');if(bsch)bsch.onclick=()=>{state.view='calendar';render();};
  const qt=$('btnQuickTop');if(qt)qt.onclick=()=>openQuickMsg(active());
  const bi=$('btnImpo');if(bi)bi.onclick=openImportant;
  const bb=$('btnBday');if(bb)bb.onclick=openBirthdays;
  const rc=$('btnRepCode');if(rc)rc.onclick=openRepCodes;
  const gt=$('btnGenTable');if(gt)gt.onclick=openGenTable;
  const gt2=$('btnGenTable2');if(gt2)gt2.onclick=openGenTable;
  const ic=$('btnInsurers');if(ic)ic.onclick=openInsurers;
  const cr=$('btnCreds');if(cr)cr.onclick=openCreds;
  const bk=$('btnBackup');if(bk)bk.onclick=openBackup;
  const dk=$('btnDark');if(dk)dk.onclick=async()=>{db.dark=!db.dark;await saveDB();render();};
  const rp=$('btnReport');if(rp)rp.onclick=()=>openReport(0);

  if(state.view==='customers'){
    const si=$('searchInput');
    if(si)si.oninput=e=>{state.search=e.target.value;render();const el=$('searchInput');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length;}};
    document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{state.gender=b.getAttribute('data-gender');render();});
    document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{state.status=b.getAttribute('data-status');render();});
    document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const tg=b.getAttribute('data-tag');state.tag=state.tag===tg?null:tg;render();});
    const ss=$('sortSel');if(ss)ss.onchange=e=>{state.sort=e.target.value;render();};
    const nc=$('btnNewCust');if(nc)nc.onclick=()=>openCustModal(null);
    const da=$('btnDelAll');if(da)da.onclick=openDeleteAll;
    const xl=$('btnExcel');if(xl)xl.onclick=openExcelImport;
    document.querySelectorAll('[data-cid]').forEach(el=>el.onclick=()=>{state.activeId=el.getAttribute('data-cid');state.mobileDetail=true;render();});
    const back=$('btnBack');if(back)back.onclick=()=>{state.mobileDetail=false;render();};

    const c=active();
    if(c){
      const st=$('statusSel');if(st)st.onchange=async e=>{
        const prevSt=c.status;
        c.status=e.target.value;c.updatedAt=Date.now();
        if(!db.statusLog)db.statusLog=[];
        if(prevSt!==c.status)db.statusLog.push({date:todayStr(),cid:c.id,from:prevSt||'',to:c.status});
        await saveDB();render();
      };
      const ed=$('btnEditCust');if(ed)ed.onclick=()=>openCustModal(c);
      const dl=$('btnDelCust');if(dl)dl.onclick=async()=>{
        if(!confirm(`'${c.name}' 고객을 삭제할까요? 상담 이력도 함께 삭제됩니다.`))return;
        db.customers=db.customers.filter(x=>x.id!==c.id);state.activeId=null;state.mobileDetail=false;
        await saveDB();render();toast('고객을 삭제했습니다.');
      };
      const qm=$('btnQuickMsg');if(qm)qm.onclick=()=>openQuickMsg(c);
      const cp=$('btnCopyInfo');if(cp)cp.onclick=()=>{
        const txt=`이름: ${c.name}\n전화: ${c.phone||''}\n주민번호: ${c.rrn||''}\n주소: ${c.address||''}\n직업: ${c.job||''}\n운전: ${c.driving||''}\n병력: ${c.medical||'없음'}\n메모: ${c.memo||''}`;
        navigator.clipboard.writeText(txt).then(()=>toast('고객 정보를 복사했습니다.')).catch(()=>toast('복사에 실패했습니다.'));
      };
      const cn=$('btnContactNow');if(cn)cn.onclick=async()=>{c.lastContact=todayStr();c.updatedAt=Date.now();await saveDB();render();toast('오늘 연락한 것으로 기록했습니다.');};
      const svC=$('btnSaveCar');if(svC)svC.onclick=async()=>{
        const ce=$('carEnd').value;
        if(!ce){toast('만기일을 선택해 주세요.');return;}
        c.carInsurer=$('carInsurer').value.trim();c.carNo=$('carNo').value.trim();c.carEnd=ce;
        c.updatedAt=Date.now();await saveDB();render();toast('자동차보험 정보를 등록했습니다.');
      };
      const edC=$('btnEditCar');if(edC)edC.onclick=()=>openCarModal(c);
      const dlC=$('btnDelCar');if(dlC)dlC.onclick=async()=>{
        if(!confirm('자동차보험 정보를 삭제할까요?'))return;
        delete c.carInsurer;delete c.carNo;delete c.carEnd;
        c.updatedAt=Date.now();await saveDB();render();
      };
      const ac=$('btnAddClaim');if(ac)ac.onclick=()=>openClaimModal(c,null);
      document.querySelectorAll('[data-claim-edit]').forEach(bt=>bt.onclick=()=>{const q=(c.claims||[]).find(x=>x.id===bt.getAttribute('data-claim-edit'));if(q)openClaimModal(c,q);});
      document.querySelectorAll('[data-claim-del]').forEach(bt=>bt.onclick=async()=>{
        if(!confirm('이 청구 건을 삭제할까요?'))return;
        c.claims=(c.claims||[]).filter(x=>x.id!==bt.getAttribute('data-claim-del'));
        c.updatedAt=Date.now();await saveDB();render();
      });
      document.querySelectorAll('[data-claim-st]').forEach(sl=>sl.onchange=async()=>{
        const q=(c.claims||[]).find(x=>x.id===sl.getAttribute('data-claim-st'));
        if(!q)return;
        q.status=sl.value;c.updatedAt=Date.now();await saveDB();render();
        if(q.status==='지급완료')toast('🎉 지급 완료! 퀵메시지로 안내 문자를 보내보세요.');
      });
      const pr=$('btnPrint');if(pr)pr.onclick=()=>printCounselCard(c);
      const ap=$('btnAddPolicy');if(ap)ap.onclick=()=>openPolicyModal(c,null);
      document.querySelectorAll('[data-pol-edit]').forEach(bt=>bt.onclick=()=>{const p=(c.policies||[]).find(x=>x.id===bt.getAttribute('data-pol-edit'));if(p)openPolicyModal(c,p);});
      document.querySelectorAll('[data-pol-del]').forEach(bt=>bt.onclick=async()=>{
        if(!confirm('이 계약을 삭제할까요?'))return;
        c.policies=(c.policies||[]).filter(x=>x.id!==bt.getAttribute('data-pol-del'));
        c.updatedAt=Date.now();await saveDB();render();
      });
      const svS=$('btnSaveSilson');if(svS)svS.onclick=async()=>{
        const jd=$('silsonJoin').value;
        if(!jd){toast('가입일을 선택해 주세요.');return;}
        c.silsonJoin=jd;c.silsonInsurer=$('silsonInsurer').value.trim();c.updatedAt=Date.now();
        await saveDB();render();toast('실손 세대를 계산했습니다.');
      };
      const sd=$('btnSilsonDetail');if(sd)sd.onclick=()=>openSilsonDetail(c);
      const edS=$('btnEditSilson');if(edS)edS.onclick=()=>openSilsonModal(c);
      const dlS=$('btnDelSilson');if(dlS)dlS.onclick=async()=>{
        if(!confirm('실손 정보를 삭제할까요?'))return;
        delete c.silsonJoin;delete c.silsonInsurer;c.updatedAt=Date.now();
        await saveDB();render();
      };
      const ah=$('btnAddHist');if(ah)ah.onclick=async()=>{
        const d=$('histDate').value,ct=$('histContent').value.trim();
        if(!ct){toast('상담 내용을 입력해 주세요.');return;}
        if(!c.history)c.history=[];
        const hd=d||todayStr();
        c.history.push({id:uid(),date:hd,content:ct});c.updatedAt=Date.now();
        if(!c.lastContact||hd>c.lastContact)c.lastContact=hd;
        const nx=$('histNext').value.trim();
        let msg='상담 기록을 추가했습니다.';
        if(nx){
          let nd=$('histNextDate').value;
          if(!nd){const f=new Date();f.setDate(f.getDate()+7);nd=fmtD(f);}
          db.events.push({id:uid(),done:false,date:nd,time:'',category:'재연락',title:c.name+' · '+nx,customerId:c.id});
          msg='상담 기록 + 다음 할 일('+nd+') 캘린더 등록 완료';
        }
        await saveDB();render();toast(msg);
      };
      document.querySelectorAll('[data-del-hist]').forEach(b=>b.onclick=async()=>{
        c.history=(c.history||[]).filter(h=>h.id!==b.getAttribute('data-del-hist'));
        await saveDB();render();
      });
    }
  }

  if(state.view==='calendar'){
    $('calPrev').onclick=()=>{state.calM--;if(state.calM<0){state.calM=11;state.calY--;}render();};
    $('calNext').onclick=()=>{state.calM++;if(state.calM>11){state.calM=0;state.calY++;}render();};
    $('calToday').onclick=()=>{const d=new Date();state.calY=d.getFullYear();state.calM=d.getMonth();render();};
    $('btnNewEvent').onclick=()=>openEventModal(null,todayStr());
    document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
      cell.onclick=e=>{if(e.target.closest('.evt'))return;openEventModal(null,cell.getAttribute('data-date'));};
    });
    document.querySelectorAll('[data-toggle]').forEach(cb=>{
      cb.onclick=async e=>{e.stopPropagation();
        const ev=db.events.find(x=>x.id===cb.getAttribute('data-toggle'));
        if(ev){ev.done=cb.checked;await saveDB();render();}
      };
    });
    document.querySelectorAll('[data-evt]').forEach(el=>{
      el.onclick=e=>{if(e.target.tagName==='INPUT')return;e.stopPropagation();
        const ev=db.events.find(x=>x.id===el.getAttribute('data-evt'));
        if(ev)openEventModal(ev,ev.date);
      };
    });
  }
}

/* ================= 모달 공용 ================= */
function modal(html){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-backdrop" id="mb">${html}</div>`;
  const mb=document.getElementById('mb');
  mb.addEventListener('click',e=>{if(e.target===mb)root.innerHTML='';});
  return {close:()=>root.innerHTML=''};
}

    <h3>${isEdit?'고객 정보 수정':'새 고객 추가'}</h3>
    <div class="two">
      <div class="field"><label>이름 *</label><input id="fName" value="${esc(x.name||'')}" placeholder="홍길동"></div>
      <div class="field"><label>전화번호</label><input id="fPhone" value="${esc(x.phone||'')}" placeholder="010-0000-0000" inputmode="tel"></div>
    </div>
    <div class="field"><label>주민번호</label><input id="fRrn" value="${esc(x.rrn||'')}" placeholder="900101-1234567" inputmode="numeric">
      <div class="hint">입력하면 성별·만나이·보험나이·상령일·생일이 자동 계산됩니다.</div></div>
    <div class="two">
      <div class="field"><label>생년월일 (선택)</label><input id="fBirth" value="${esc(x.birth||'')}" placeholder="1990-01-01">
        <div class="hint">주민번호가 특이 형식일 때 우선 적용됩니다.</div></div>
      <div class="field"><label>증권번호</label><input id="fPolicy" value="${esc(x.policyNo||'')}" placeholder="6AAAX-0000"></div>
    </div>
    <div class="field"><label>주소 (현주소)</label><input id="fAddr" value="${esc(x.address||'')}" placeholder="의정부시 ○○로 30, 106동 507호"></div>
    <div class="field"><label>미팅장소</label><input id="fMeet" value="${esc(x.meetingPlace||'')}" placeholder="자택 근처 카페, 사무실 등"></div>
    <div class="two">
      <div class="field"><label>직업</label><input id="fJob" value="${esc(x.job||'')}" placeholder="간호사/의료직"></div>
      <div class="field"><label>운전 여부</label><input id="fDrive" value="${esc(x.driving||'')}" placeholder="승용차 (자가용)"></div>
    </div>
    <div class="field"><label>병력 / 고지사항</label><input id="fMed" value="${esc(x.medical||'')}" placeholder="없음"></div>
    <div class="field"><label>메모</label><textarea id="fMemo" placeholder="가족관계, 소개 경로, 특이사항">${esc(x.memo||'')}</textarea></div>
    <div class="field"><label>소개자 (선택)</label>
      <select id="fReferrer"><option value="">— 없음 —</option>${db.customers.filter(z=>z.id!==(x.id||'')).map(z=>`<option value="${z.id}" ${x.referrerId===z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select>
      <div class="hint">이 고객을 소개해 준 기존 고객을 연결하면 소개 계보가 표시됩니다.</div></div>
    <div class="field"><label>태그 (쉼표로 구분)</label><input id="fTags" value="${esc((x.tags||[]).join(', '))}" placeholder="인카DB, 지인소개, 리모델링 대상"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="mCancel">취소</button>
      <button class="btn-primary" id="mSave">${isEdit?'저장':'추가'}</button>
    </div>
  </div>`);
  document.getElementById('mCancel').onclick=m.close;
  document.getElementById('mSave').onclick=async()=>{
    const name=document.getElementById('fName').value.trim();
    if(!name){toast('이름을 입력해 주세요.');return;}
    const rrn=document.getElementById('fRrn').value.trim();
    const parsed=parseRRN(rrn);
    const data={
      name,phone:document.getElementById('fPhone').value.trim(),rrn,
      birth:document.getElementById('fBirth').value.trim(),
      policyNo:document.getElementById('fPolicy').value.trim(),
      gender:parsed?parsed.gender:(x.gender||''),
      address:document.getElementById('fAddr').value.trim(),
      meetingPlace:document.getElementById('fMeet').value.trim(),
      job:document.getElementById('fJob').value.trim(),
      driving:document.getElementById('fDrive').value.trim(),
      medical:document.getElementById('fMed').value.trim(),
      memo:document.getElementById('fMemo').value.trim(),
      referrerId:document.getElementById('fReferrer').value||null,
      tags:document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
      updatedAt:Date.now()

    else{
      const nc={id:uid(),status:'가망고객',history:[],createdAt:Date.now(),...data};
      db.customers.push(nc);state.activeId=nc.id;state.mobileDetail=true;
    }
    await saveDB();m.close();render();toast(isEdit?'수정했습니다.':'새 고객을 추가했습니다.');
  };
}

function openSilsonModal(c){
  const m=modal(`
  <div class="modal">
    <h3>실손 정보 수정</h3>
    <div class="field"><label>보험사</label><input id="sIns" value="${esc(c.silsonInsurer||'')}" placeholder="현대해상"></div>
    <div class="field"><label>가입일</label><input type="date" id="sJoin" value="${esc(c.silsonJoin||'')}"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="mCancel">취소</button>
      <button class="btn-primary" id="mSave">저장</button>
    </div>
  </div>`);
  document.getElementById('mCancel').onclick=m.close;
  document.getElementById('mSave').onclick=async()=>{
    const jd=document.getElementById('sJoin').value;
    if(!jd){toast('가입일을 선택해 주세요.');return;}
    c.silsonJoin=jd;c.silsonInsurer=document.getElementById('sIns').value.trim();c.updatedAt=Date.now();
    await saveDB();m.close();render();
  };
}

/* ================= 일정 ================= */
function openEventModal(ev,dateStr){
  const isEdit=!!ev;const x=ev||{date:dateStr,time:'',category:'미팅',title:''};
  const custOpts=db.customers.map(c=>`<option value="${c.id}" ${x.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const m=modal(`
  <div class="modal">
    <h3>${isEdit?'일정 수정':'일정 추가'}</h3>

/* ================= 📜 SCRIPT ================= */
let scriptTab=null;
function openScript(c){
  if(!db.scripts.length)db.scripts.push({id:uid(),name:'새 스크립트',body:''});
  if(!scriptTab||!db.scripts.find(s=>s.id===scriptTab))scriptTab=db.scripts[0].id;
  function fill(t){
    let out=t.replaceAll('{설계사명}',db.agent||'○○○');
    if(c)out=out.replaceAll('○○○ 님',c.name+' 님').replaceAll('{고객명}',c.name);
    return out;
  }
  const cur=db.scripts.find(s=>s.id===scriptTab);
  const m=modal(`
  <div class="modal wide">
    <h3>📜 상담 스크립트 ${c?`<span style="font-size:13px;color:var(--muted)">— ${esc(c.name)} 고객님 적용 중</span>`:''}</h3>
    <div class="script-tabs">
      ${db.scripts.map(s=>`<button class="stab ${s.id===scriptTab?'on':''}" data-stab="${s.id}">${esc(s.name)}</button>`).join('')}
      <button class="stab" id="sAdd">＋ 추가</button>
    </div>
    <div class="two" style="margin-bottom:8px">
      <div class="field" style="margin:0"><label>스크립트 이름</label><input id="sName" value="${esc(cur.name)}"></div>
      <div class="field" style="margin:0;display:flex;align-items:flex-end;gap:6px">
        <button class="btn-primary" id="sSave">저장</button>
        <button class="btn-cancel" id="sCopy">📋 ${c?'적용본 복사':'복사'}</button>
        <button class="btn-danger-line" id="sDel" style="margin:0">삭제</button>
      </div>
    </div>
    <textarea class="script-body" id="sBody">${esc(cur.body)}</textarea>
    ${c?`<div class="gen-note" style="margin-top:10px">미리보기 (이름 자동 적용):<br><span style="white-space:pre-wrap">${esc(fill(cur.body)).slice(0,400)}${cur.body.length>400?'…':''}</span></div>`:''}
    <div class="modal-actions"><button class="btn-cancel" id="mClose">닫기</button></div>
  </div>`);
  document.getElementById('mClose').onclick=m.close;
  document.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{scriptTab=b.getAttribute('data-stab');m.close();openScript(c);});
  document.getElementById('sAdd').onclick=async()=>{
    const ns={id:uid(),name:'새 스크립트',body:''};
    db.scripts.push(ns);scriptTab=ns.id;await saveDB();m.close();openScript(c);
  };
  document.getElementById('sSave').onclick=async()=>{
    cur.name=document.getElementById('sName').value.trim()||'스크립트';
    cur.body=document.getElementById('sBody').value;
    await saveDB();toast('스크립트를 저장했습니다.');m.close();openScript(c);
  };
  document.getElementById('sCopy').onclick=()=>{
    const txt=c?fill(document.getElementById('sBody').value):document.getElementById('sBody').value;
    navigator.clipboard.writeText(txt).then(()=>toast('스크립트를 복사했습니다.')).catch(()=>toast('복사 실패'));
  };
  document.getElementById('sDel').onclick=async()=>{
    if(db.scripts.length<=1){toast('마지막 스크립트는 삭제할 수 없습니다.');return;}
    if(!confirm(`'${cur.name}' 스크립트를 삭제할까요?`))return;
    db.scripts=db.scripts.filter(s=>s.id!==cur.id);scriptTab=db.scripts[0].id;
    await saveDB();m.close();openScript(c);
  };
}

    collect();await saveDB();toast('템플릿을 저장했습니다.');

  document.querySelectorAll('[data-tm-del]').forEach(bt=>bt.onclick=async()=>{

    collect();
    db.templates=db.templates.filter(tp=>tp.id!==bt.getAttribute('data-tm-del'));
    await saveDB();m.close();openTemplateManager();
  });
}

/* ================= 📊 월간 활동 리포트 ================= */
function openReport(off){
  const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+off);
  const ym=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');
  const label=base.getFullYear()+'년 '+(base.getMonth()+1)+'월';
  const newCust=db.customers.filter(c=>c.createdAt&&fmtD(new Date(c.createdAt)).startsWith(ym)).length;
  const conv=(db.statusLog||[]).filter(l=>l.to==='가입완료'&&(l.date||'').startsWith(ym)).length;
  const consults=db.customers.reduce((s,c)=>s+(c.history||[]).filter(h=>(h.date||'').startsWith(ym)).length,0);
  const evts=db.events.filter(e=>e.date&&e.date.startsWith(ym));
  const done=evts.filter(e=>e.done).length;
  const meets=evts.filter(e=>e.category==='미팅').length;
  const recontact=evts.filter(e=>e.category==='재연락').length;
  const rate=evts.length?Math.round(done/evts.length*100):0;
  const contacts=db.customers.filter(c=>c.lastContact&&c.lastContact.startsWith(ym)).length;
  const box=(k,v,sub,color)=>`
    <div class="silson-card" style="border-top-color:${color||'var(--blue)'}">
      <div class="k">${k}</div><div class="v" style="color:${color||'var(--ink)'}">${v}</div>
      ${sub?`<div class="sub">${sub}</div>`:''}
    </div>`;
  const m=modal(`
  <div class="modal mid">
    <h3>📊 월간 활동 리포트
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <button class="cal-nav" id="rpPrev" style="padding:4px 10px">◀</button>
        <b style="font-size:15px">${label}</b>
        <button class="cal-nav" id="rpNext" style="padding:4px 10px" ${off>=0?'disabled style="padding:4px 10px;opacity:.4"':''}>▶</button>
      </span>
    </h3>
    <div class="silson-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      ${box('신규 등록',newCust+'명','이번 달 새 고객','var(--blue)')}
      ${box('가입완료 전환',conv+'건','가망 → 가입완료','var(--green)')}
      ${box('상담 기록',consults+'건','상담 이력 작성 수','#6C4BC4')}
      ${box('미팅 일정',meets+'건','캘린더 미팅 분류','var(--blue)')}
      ${box('재연락 액션',recontact+'건','다음 할 일 포함','#D97622')}
      ${box('일정 소화율',rate+'%',done+'/'+evts.length+'건 완료',rate>=70?'var(--green)':rate>=40?'#D97622':'var(--red)')}
      ${box('연락한 고객',contacts+'명','마지막 연락일 기준','var(--green)')}
    </div>
    <div class="gen-note" style="margin-top:12px">ℹ️ '가입완료 전환'은 상태 변경 기록이 시작된 시점부터 집계됩니다. 과거 이력은 포함되지 않아요.</div>
    <div class="modal-actions"><button class="btn-primary" id="mClose">닫기</button></div>
  </div>`);
  document.getElementById('mClose').onclick=m.close;
  document.getElementById('rpPrev').onclick=()=>{m.close();openReport(off-1);};
  const rn=document.getElementById('rpNext');
  if(rn&&off<0)rn.onclick=()=>{m.close();openReport(off+1);};
}

/* ================= 📤 엑셀 내보내기 ================= */
function exportExcel(){
  if(!db.customers.length){toast('내보낼 고객이 없습니다.');return;}
  const rows=db.customers.map(c=>{

    return {
      '이름':c.name,'성별':c.gender||'',

      '보유계약수':pols.length,'월보험료합계':pols.reduce((s,p)=>s+(+p.premium||0),0),
      '소개자':ref,'메모':c.memo||''

  });
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:8},{wch:5},{wch:11},{wch:15},{wch:14},{wch:34},{wch:12},{wch:8},{wch:20},{wch:10},{wch:11},{wch:8},{wch:11},{wch:8},{wch:24}];

}

/* ================= 🔔 자동 알림 (재가입·상령일) ================= */
function fmtD(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function generateAutoAlerts(){
  if(!db.autoAlerts)db.autoAlerts={};
  const now=new Date();const t=todayStr();let n=0;
  db.customers.forEach(c=>{
    // 실손 재가입 6개월 전 → ⭐중요 할 일 자동 생성
    const gen=c.silsonJoin?silsonGen(c.silsonJoin):null;
    if(gen&&gen.rejoin){
      const jd=new Date(c.silsonJoin);
      if(!isNaN(jd)){
        const rd=new Date(jd);rd.setFullYear(rd.getFullYear()+gen.rejoin);
        const al=new Date(rd);al.setMonth(al.getMonth()-6);
        const key='rejoin_'+c.id+'_'+rd.getFullYear();
        const daysToAlert=(al-now)/86400000;
        if(!db.autoAlerts[key]&&rd>=now&&daysToAlert<=365){
          db.events.push({id:uid(),done:false,date:al<now?t:fmtD(al),time:'',category:'중요',
            title:c.name+' · 실손 재가입 6개월 전 점검 (예정일 '+fmtD(rd)+')',customerId:c.id,auto:true});
          db.autoAlerts[key]=1;n++;
        }
      }
    }
    // 자동차보험 만기 45일 전
    if(c.carEnd){
      const ce=new Date(c.carEnd);
      if(!isNaN(ce)){
        const al2=new Date(ce);al2.setDate(al2.getDate()-45);
        const key2='car_'+c.id+'_'+ce.getFullYear()+'_'+(ce.getMonth()+1);
        const days2=(al2-now)/86400000;
        if(!db.autoAlerts[key2]&&ce>=now&&days2<=365){
          db.events.push({id:uid(),done:false,date:al2<now?t:fmtD(al2),time:'',category:'중요',
            title:c.name+' · 자동차보험 만기 45일 전 ('+c.carEnd+') 갱신 안내',customerId:c.id,auto:true});
          db.autoAlerts[key2]=1;n++;
        }
      }
    }
    // 상령일 1개월 전 → 보험료 인상 전 안내
    const b=custBirth(c);
    if(b){
      let sm=b.m+6;if(sm>12)sm-=12;
      const sd=Math.min(b.d,28);
      let occ=new Date(now.getFullYear(),sm-1,sd);
      if(occ<now)occ=new Date(now.getFullYear()+1,sm-1,sd);
      const al=new Date(occ);al.setMonth(al.getMonth()-1);
      const key='sang_'+c.id+'_'+occ.getFullYear()+'_'+sm;
      const days=(al-now)/86400000;
      if(!db.autoAlerts[key]&&days<=60&&days>=-7){
        db.events.push({id:uid(),done:false,date:al<now?t:fmtD(al),time:'',category:'중요',
          title:c.name+' · 상령일 임박 ('+String(sm).padStart(2,'0')+'/'+String(b.d).padStart(2,'0')+') — 보험료 인상 전 안내',customerId:c.id,auto:true});
        db.autoAlerts[key]=1;n++;
      }
    }
  });
  return n;
}

/* ================= 🏠 오늘 브리핑 ================= */
function renderHome(){
  const t=todayStr();
  const todays=db.events.filter(e=>e.date===t).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const overdue=db.events.filter(e=>!e.done&&e.date<t);
  const bd=birthdayPeople();
  const rejoinSoon=[];
  db.customers.forEach(c=>{
    const gen=c.silsonJoin?silsonGen(c.silsonJoin):null;
    if(gen&&gen.rejoin){
      const rj=rejoinInfo(c.silsonJoin,gen);
      if(rj){
        const jd2=new Date(c.silsonJoin);const rd=new Date(jd2);rd.setFullYear(rd.getFullYear()+gen.rejoin);
        const months=(rd-new Date())/(86400000*30.4);
        if(months<=12)rejoinSoon.push({c,rj,months});
      }
    }
  });
  rejoinSoon.sort((a,b)=>a.months-b.months);
  const absent=db.customers.filter(c=>c.status==='부재중');
  const expiring=[];
  db.customers.forEach(c=>(c.policies||[]).forEach(p=>{
    if(p.endDate){const dd=Math.ceil((new Date(p.endDate)-new Date())/86400000);if(dd<=90)expiring.push({c,p,dd});}
  }));
  expiring.sort((a,b)=>a.dd-b.dd);
  const stale=db.customers.map(c=>{
    const base=c.lastContact||fmtD(new Date(c.createdAt||Date.now()));
    const days=Math.floor((new Date(t)-new Date(base))/86400000);
    return {c,days};
  }).filter(x=>x.days>=90).sort((a,b)=>b.days-a.days);
  const carDue=db.customers.filter(c=>c.carEnd).map(c=>({c,dd:Math.ceil((new Date(c.carEnd)-new Date())/86400000)})).filter(x=>x.dd<=60).sort((a,b)=>a.dd-b.dd);
  const claimsOpen=[];db.customers.forEach(c=>(c.claims||[]).forEach(q=>{if(q.status!=='지급완료')claimsOpen.push({c,q});}));
  const card=(title,items,empty,extra)=>`
    <div class="section" style="margin:0">

  return `
  <div style="padding-top:0">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
      ${card(`🗓 오늘 일정 <span style="margin-left:auto;font-size:12px;color:var(--muted)">${todays.length}건 · 기한초과 ${overdue.length}건</span>`,
        todays.map(e=>`<div style="display:flex;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13px;${e.done?'opacity:.5;text-decoration:line-through':''}"><span class="mono" style="color:var(--blue);font-weight:700;min-width:44px">${esc(e.time||'—')}</span><span>${e.category==='중요'?'⭐ ':''}${esc(e.title)}</span></div>`),
        '오늘 등록된 일정이 없습니다.',
        `<div style="margin-top:10px"><button class="mini" data-go-cal="1">캘린더 열기 →</button></div>`)}
      ${card(`🎂 이번 달 생일 <span style="margin-left:auto;font-size:12px;color:var(--muted)">${bd.length}명</span>`,
        bd.slice(0,6).map(x=>custRow(x.c.id,(x.today?'<span style="color:var(--red);font-weight:800">오늘! </span>':'')+esc(x.c.name),(new Date().getMonth()+1)+'/'+x.day)),
        '이번 달 생일 고객이 없습니다.')}
      ${card(`🏥 실손 재가입 임박 <span style="margin-left:auto;font-size:12px;color:var(--muted)">12개월 내 ${rejoinSoon.length}명</span>`,
        rejoinSoon.slice(0,6).map(x=>custRow(x.c.id,esc(x.c.name),`<span style="color:${x.months<0?'var(--red)':'#D97622'};font-weight:700">${x.rj.remain}</span>`)),
        '12개월 내 재가입 예정 고객이 없습니다.')}
      ${card(`📵 부재중 재연락 <span style="margin-left:auto;font-size:12px;color:var(--muted)">${absent.length}명</span>`,
        absent.slice(0,6).map(c=>custRow(c.id,esc(c.name),esc(c.phone||''))),

      ${card(`💤 장기 미접촉 (90일+) <span style="margin-left:auto;font-size:12px;color:var(--muted)">${stale.length}명</span>`,
        stale.slice(0,6).map(x=>custRow(x.c.id,esc(x.c.name),`<span style="color:#D97622;font-weight:700">${x.days}일 경과</span>`)),

function silsonStatus(gen,rj){
  if(!gen.rejoin)return {label:'유지 권장',color:'var(--green)',sub:'재가입 의무 없음 — 전환 비추천'};
  if(rj&&rj.passed)return {label:'점검 필요',color:'var(--red)',sub:'재가입 시점 경과 — 즉시 확인'};
  if(rj){

}

    const sel=document.getElementById('tplSelected');sel.style.display='block';
    document.getElementById('tplPreview').textContent=txt;
    document.getElementById('btnCopyMsg').onclick=()=>navigator.clipboard.writeText(txt).then(()=>toast('메시지를 복사했습니다.')).catch(()=>toast('복사 실패'));
    const sms=document.getElementById('btnSms');
    if(sms){sms.href='sms:'+phoneClean+'?body='+encodeURIComponent(txt);sms.onclick=async()=>{if(c){c.lastContact=todayStr();await saveDB();}};}
    document.getElementById('btnBackTpl').onclick=()=>{sel.style.display='none';document.getElementById('tplList').style.display='block';};
  });
}


/* ================= 📗 엑셀 일괄 등록 ================= */
function normPhone(p){return (p||'').toString().replace(/[^0-9]/g,'');}
function mergeCustomers(rows){
  // rows: [{name,birth,rrn,phone,address,policyNo,gender,job,memo}]
  let added=0,updated=0;
  rows.forEach(r=>{
    if(!r.name)return;
    const np=normPhone(r.phone);
    let ex=db.customers.find(c=>np&&normPhone(c.phone)===np)
        ||db.customers.find(c=>c.name===r.name&&(c.rrn||'')===(r.rrn||''))
        ||(!np&&db.customers.find(c=>c.name===r.name));
    if(ex){
      // 빈 칸만 채움 (기존 입력 보존)
      ['birth','rrn','phone','address','policyNo','gender','job','memo'].forEach(k=>{
        if(r[k]&&!ex[k])ex[k]=r[k];
      });
      ex.updatedAt=ex.updatedAt||Date.now();
      updated++;
    }else{
      db.customers.push({
        id:uid(),status:'가망고객',history:[],
        createdAt:Date.now(),updatedAt:Date.now(),
        name:r.name,birth:r.birth||'',rrn:r.rrn||'',phone:r.phone||'',
        address:r.address||'',policyNo:r.policyNo||'',gender:r.gender||'',
        job:r.job||'',memo:r.memo||''
      });
      added++;
    }
  });
  return {added,updated};
}
function genderFromRRN(rrn){
  const p=parseRRN(rrn||'');
  return p?p.gender:'';
}
function openExcelImport(){
  const m=modal(`
  <div class="modal mid">
    <h3>📗 엑셀 일괄 등록</h3>
    <div class="gen-note">첫 행이 제목인 엑셀(.xlsx/.csv)을 올려주세요.<br>
    인식 컬럼: <b>이름</b>(필수) · 생년월일 · 주민번호 · 연락처/전화번호 · 주소 · 증권번호 · 직업 · 메모<br>
    같은 연락처(또는 이름+주민번호)의 고객은 새로 만들지 않고 <b>빈 항목만 채워서 병합</b>합니다.</div>
    <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)">
      <button class="btn-primary" id="xlExport" style="background:var(--green)">📤 현재 고객 명단 엑셀로 내보내기</button>
      <div class="hint" style="margin-top:6px">지점 보고, 다른 프로그램 이관, 예비 백업용으로 쓸 수 있습니다.</div>
    </div>
    <div class="field"><input type="file" id="xlFile" accept=".xlsx,.xls,.csv"></div>
    <div id="xlResult"></div>
    <div class="modal-actions"><button class="btn-cancel" id="mClose">닫기</button></div>
  </div>`);
  document.getElementById('mClose').onclick=m.close;
  document.getElementById('xlExport').onclick=exportExcel;
  document.getElementById('xlFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:''});
        if(!json.length){toast('데이터가 없습니다. 첫 행이 제목인지 확인해 주세요.');return;}
        const pick=(row,keys)=>{for(const k of keys){for(const rk of Object.keys(row)){if(rk.replace(/\s/g,'').includes(k))return String(row[rk]).trim();}}return '';};
        const rows=json.map(row=>{
          const rrn=pick(row,['주민번호','주민']);
          let birth=pick(row,['생년월일','생일']);
          if(birth&&/^\d{4}[.\/]\d{1,2}[.\/]\d{1,2}/.test(birth))birth=birth.replace(/[.\/]/g,'-');
          if(birth&&/^\d{4}-\d{1,2}-\d{1,2}/.test(birth)){
            const p=birth.split('-');birth=p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].slice(0,2).padStart(2,'0');
          }
          return {
            name:pick(row,['이름','성명','고객명']),
            birth,rrn,
            phone:pick(row,['연락처','전화','휴대폰','핸드폰']),
            address:pick(row,['주소']),
            policyNo:pick(row,['증권번호','증권']),
            job:pick(row,['직업']),
            memo:pick(row,['메모','비고','특이사항']),
            gender:genderFromRRN(rrn)
          };
        }).filter(r=>r.name);
        const res=mergeCustomers(rows);
        await saveDB();
        document.getElementById('xlResult').innerHTML=
          `<div class="gen-note" style="background:var(--green-soft);border-color:#B5DEC9">✅ 신규 등록 <b>${res.added}명</b> · 기존 병합 <b>${res.updated}명</b> (총 ${rows.length}행 처리)</div>`;
        render();
        toast('엑셀 명단을 등록했습니다.');
      }catch(err){toast('파일을 읽지 못했습니다. 형식을 확인해 주세요.');}
    };
    reader.readAsArrayBuffer(f);
  };
}

/* ================= 백업 ================= */
function openBackup(){
  const m=modal(`
  <div class="modal">
    <h3>💾 백업 / 복원</h3>
    <div class="field"><label>내보내기</label>
      <div class="hint" style="margin-bottom:8px">전체 데이터(고객·일정·스크립트·연락처 등)를 JSON 파일로 저장합니다. 다른 기기에서 '가져오기'로 불러올 수 있습니다.</div>
      <button class="btn-primary" id="btnExport">📤 파일로 내보내기</button>
    </div>
    <div class="field"><label>가져오기</label>
      <div class="hint" style="margin-bottom:8px">⚠️ 가져오면 현재 데이터를 백업 파일 내용으로 덮어씁니다.</div>
      <input type="file" id="importFile" accept=".json">
    </div>
    <div class="modal-actions"><button class="btn-cancel" id="mClose">닫기</button></div>
  </div>`);
  document.getElementById('mClose').onclick=m.close;
  document.getElementById('btnExport').onclick=async()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='crm-backup-'+todayStr()+'.json';
    a.click();URL.revokeObjectURL(a.href);
    db.lastBackup=todayStr();await saveDB();
    toast('백업 파일을 내려받았습니다.');
  };
  document.getElementById('importFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.customers||!Array.isArray(d.customers))throw 0;
        if(!confirm(`백업 파일(고객 ${d.customers.length}명)로 현재 데이터를 덮어쓸까요?`))return;
        db=d;
        if(!db.scripts)db.scripts=[];if(!db.repCodes)db.repCodes=[];
        if(!db.insurerContacts)db.insurerContacts=[];if(!db.credentials)db.credentials=[];
        await saveDB();m.close();render();toast('백업을 복원했습니다.');
      }catch(err){toast('올바른 백업 파일이 아닙니다.');}
    };
    r.readAsText(f);
  };
}
